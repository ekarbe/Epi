[package]
name = "epi"
version = "1.1.0"
description = "Epi - Local-first Meeting Intelligence"
authors = ["Eike Christian Karbe"]
edition = "2021"
default-run = "epi"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "epi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.4", features = ["all"] }
cpal = "0.18.1"
bytemuck = "1.15.0"
chrono = "0.4.45"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-os = "2.3.2"
dirs = "5.0.1"
walkdir = "2.5.0"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-store = "2.4.3"
tauri-plugin-stronghold = "2.3.1"
reqwest = { version = "0.13.4", features = ["json", "multipart", "stream"] }
base64 = "0.22.1"
tokio = { version = "1.52.3", features = ["time", "process", "rt", "rt-multi-thread", "sync", "io-util"] }
blake2b_simd = "1.0.4"
libc = "0.2"
zip = "8.6.0"
tar = "0.4"
flate2 = "1.0"
log = "0.4.33"
simplelog = "0.12.2"

[dev-dependencies]
tempfile = "3.27.0"
mockall = "0.13.0"
httpmock = "0.7.0"
